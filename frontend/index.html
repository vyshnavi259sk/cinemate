<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CineMate — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --ink: #0d0d0d; --cream: #f7f3ee; --gold: #c9a84c; --red: #b5291e; --mid: #6b6560; --border: rgba(0,0,0,0.12); }
    html, body { height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--ink); display: flex; min-height: 100vh; }
    .panel-left { width: 55%; background: var(--ink); position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; padding: 3rem; }
    .film-strip { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(90deg, var(--gold) 0 14px, transparent 14px 20px); }
    .dots { position: absolute; top: 3rem; right: 3rem; display: grid; grid-template-columns: repeat(8, 6px); gap: 10px; }
    .dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.08); }
    .dots span:nth-child(3n) { background: rgba(201,168,76,0.4); }
    .hero-title { font-family: 'Playfair Display', serif; font-size: clamp(3rem, 5vw, 5.5rem); font-weight: 900; color: var(--cream); line-height: 1; letter-spacing: -0.02em; }
    .hero-title span { color: var(--gold); }
    .hero-sub { margin-top: 1rem; color: var(--mid); font-size: 1rem; font-weight: 300; letter-spacing: 0.04em; text-transform: uppercase; }
    .panel-right { width: 45%; display: flex; align-items: center; justify-content: center; padding: 3rem 4rem; }
    .form-wrap { width: 100%; max-width: 360px; }
    .backend-sel { margin-bottom: 1.5rem; }
    .backend-sel label { display: block; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--mid); margin-bottom: 0.4rem; }
    .backend-sel select { width: 100%; padding: 0.6rem 0.9rem; border: 1.5px solid var(--border); border-radius: 4px; background: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--ink); outline: none; cursor: pointer; }
    .backend-sel select:focus { border-color: var(--gold); }
    .form-label { font-size: 0.7rem; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mid); margin-bottom: 2rem; display: block; }
    h2 { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700; margin-bottom: 2rem; }
    .field { margin-bottom: 1.2rem; }
    .field label { display: block; font-size: 0.75rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mid); margin-bottom: 0.45rem; }
    .field input { width: 100%; padding: 0.8rem 1rem; border: 1.5px solid var(--border); border-radius: 4px; background: #fff; font-family: 'DM Sans', sans-serif; font-size: 0.95rem; color: var(--ink); outline: none; transition: border-color 0.2s; }
    .field input:focus { border-color: var(--gold); }
    .btn-primary { width: 100%; padding: 0.9rem; background: var(--ink); color: var(--cream); border: none; border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; margin-top: 0.8rem; transition: background 0.2s; }
    .btn-primary:hover { background: #222; }
    .divider { display: flex; align-items: center; gap: 0.8rem; margin: 1.5rem 0; color: var(--mid); font-size: 0.75rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .btn-sec { width: 100%; padding: 0.85rem; background: transparent; color: var(--ink); border: 1.5px solid var(--border); border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: block; text-align: center; transition: border-color 0.2s; }
    .btn-sec:hover { border-color: var(--ink); }
    .msg { margin-top: 0.8rem; padding: 0.7rem 0.9rem; border-radius: 4px; font-size: 0.85rem; display: none; }
    .msg.error { background: #fdf0ef; color: var(--red); border: 1px solid #f5c6c3; display: block; }
    .msg.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
    @media (max-width: 768px) { body { flex-direction: column; } .panel-left, .panel-right { width: 100%; padding: 2rem; } }
  </style>
</head>
<body>
  <div class="panel-left">
    <div class="film-strip"></div>
    <div class="dots"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div>
      <div class="hero-title">Cine<span>Mate</span></div>
      <p class="hero-sub">Your curated cinema catalogue</p>
    </div>
  </div>
  <div class="panel-right">
    <div class="form-wrap">
      <div class="backend-sel">
        <label>Backend Architecture</label>
        <select id="backendSelect">
          <option value="http://100.56.165.174">Architecture 1 — EC2 (Flask)</option>
          <option value="http://18.208.221.66">Architecture 2 — ECS Fargate</option>
          <option value="https://ish4adz2di.execute-api.us-east-1.amazonaws.com/prod">Architecture 3 — Lambda + API Gateway</option>
        </select>
      </div>
      <span class="form-label">Member Access</span>
      <h2>Welcome back</h2>
      <form id="loginForm">
        <div class="field"><label>Email address</label><input type="email" id="email" placeholder="olivia@example.com" required/></div>
        <div class="field"><label>Password</label><input type="password" id="password" placeholder="••••••••" required/></div>
        <button type="submit" class="btn-primary">Sign In</button>
        <div class="msg" id="msg"></div>
      </form>
      <div class="divider">or</div>
      <a href="register.html" class="btn-sec">Create an account</a>
    </div>
  </div>
  <script>
    const sel = document.getElementById('backendSelect');
    const saved = localStorage.getItem('cinemate_backend');
    if (saved) sel.value = saved;
    sel.addEventListener('change', () => localStorage.setItem('cinemate_backend', sel.value));

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const msg      = document.getElementById('msg');
      const api      = sel.value;
      localStorage.setItem('cinemate_backend', api);
      try {
        const res  = await fetch(`${api}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          sessionStorage.setItem('cinemate_user', data.email);
          sessionStorage.setItem('cinemate_username', data.username);
          msg.className = 'msg success';
          msg.textContent = `Welcome back, ${data.username}! Redirecting…`;
          setTimeout(() => window.location.href = 'main.html', 800);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.error || 'Email or password is invalid';
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Could not connect to server. Check backend selection.';
      }
    });
  </script>
</body>
</html>
